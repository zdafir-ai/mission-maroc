<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}</style>

<body>
<title>Mission Maroc Junior</title>
<style>
/* Layout: a road across five Moroccan cities; each city is a street of 10 stones, each stone opens 5 arched doors. Single deliberate look, tinted per city. */
:root{
  --city:#1E4FA8;--deep:#14336F;--encre:#14233F;--mur:#EEF4FF;--ciel:#BCD3F5;
  --safran:#F4B223;--blanc:#FFFFFF;--vert:#177A57;--rouge:#B3372C;--gris:#566380;
  --titre:'Baloo Bhaijaan 2','Noto Naskh Arabic',system-ui,sans-serif;
  --texte:Nunito,system-ui,sans-serif;
  --arabe:'Noto Naskh Arabic','Baloo Bhaijaan 2',serif;
  --emoji:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;
}
html,body{height:100%}
body{background:var(--city);color:var(--encre);font:600 18px/1.35 var(--texte);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body.wall{background:var(--mur)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:4px solid var(--safran);outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{max-width:560px;min-height:100%;margin:0 auto;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px}
.ar{font-family:var(--arabe)}
.emo{font-family:var(--emoji);line-height:1.1}

/* écrans colorés */
.dark{background:var(--city);color:var(--blanc)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font:800 30px/1.05 var(--titre)}
.top .mid{flex:1;min-width:0}
.top .mid h1{font-size:28px}
.top .mid p{color:var(--safran);font-weight:800;font-size:16px}
.score{display:flex;align-items:center;gap:6px;background:var(--deep);border-radius:999px;padding:6px 14px;font-weight:800;font-size:20px;flex:none}
.score svg{width:22px;height:22px}
.round{width:52px;height:52px;border-radius:50%;background:var(--blanc);display:grid;place-items:center;flex:none;color:var(--city)}
.round svg{width:26px;height:26px}
.sub{color:var(--safran);font-weight:800;font-size:17px}

/* voyage */
.road{display:flex;flex-direction:column;gap:14px;margin-top:18px;flex:1}
.citycard{display:flex;align-items:center;gap:14px;background:var(--deep);border-radius:18px;padding:14px;text-align:start;color:var(--blanc);border:3px solid transparent}
.citycard.now{border-color:var(--safran)}
.citycard.lock{opacity:.55}
.stamp{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 26px/1 var(--titre);border:3px dashed var(--ciel);color:var(--ciel)}
.citycard.done .stamp{border:3px solid var(--blanc);background:var(--safran);color:var(--encre)}
.cityname{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cityname b{font:800 24px/1.1 var(--titre)}
.cityname span.ar{font-size:20px;line-height:1.3;color:var(--ciel);align-self:flex-start}
.bar10{height:10px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden}
.bar10 i{display:block;height:100%;background:var(--safran)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--ciel);margin-top:14px}
.link{text-decoration:underline;min-height:44px;padding:0 4px;font-weight:800;color:var(--ciel)}

/* ville */
.street{position:relative;height:900px;margin-top:8px}
.street svg.way{position:absolute;inset:0;width:100%;height:100%}
.stone{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--blanc)}
.stone .disc{width:78px;height:78px;border-radius:50%;background:var(--ciel);color:var(--encre);border:5px solid var(--deep);display:grid;place-items:center;font:800 30px/1 var(--titre)}
.stone.now .disc{background:var(--blanc);border-color:var(--safran);animation:pulse 1.6s ease-in-out infinite}
.stone.done .disc{background:var(--safran);border-color:var(--blanc)}
.stone.lock .disc{opacity:.55}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--deep)}
.dots i.on{background:var(--safran)}
@keyframes pulse{50%{transform:scale(1.07)}}

/* étape : 5 portes */
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px;margin-top:26px;justify-items:center}
.doors .door:last-child{grid-column:1/-1}
.door{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--blanc);font-weight:800;font-size:17px}
.arch{width:104px;height:122px;border-radius:52px 52px 8px 8px;background:var(--ciel);border:5px solid var(--deep);display:grid;place-items:center;font:800 34px/1.2 var(--titre);color:var(--encre);padding:4px}
.arch.ar{font-family:var(--arabe);font-size:44px}
.door.done .arch{background:var(--safran);border-color:var(--blanc)}
.stars{display:flex;gap:2px;height:20px}
.stars svg{width:20px;height:20px}

/* activité */
.lesson{background:var(--mur)}
.bar{display:flex;align-items:center;gap:10px}
.lesson .round{background:var(--blanc)}
.steps{flex:1;display:flex;gap:6px}
.steps i{flex:1;height:12px;border-radius:6px;background:var(--ciel)}
.steps i.on{background:var(--city)}
.q{font:800 26px/1.35 var(--titre);color:var(--city);text-align:center;text-wrap:balance;margin:16px 0 12px}
.q.ar{line-height:1.6}
.play{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;min-width:0}
.msg{min-height:40px;text-align:center;font:800 24px/1.3 var(--titre)}
.msg.ok{color:var(--vert)}.msg.no{color:var(--rouge)}
.tile{background:var(--blanc);border-radius:14px;border:4px solid var(--ciel);min-height:84px;display:grid;place-items:center;font:800 38px/1.15 var(--texte);padding:8px;color:var(--encre);min-width:0}
.tile.ar,.tile .ar{font-family:var(--arabe);line-height:1.5}
.tile.ar{font-size:40px}
.tile svg{height:62px;width:auto;max-width:100%}
.tile .emo{font-size:46px}
.tile.word{display:flex;align-items:center;justify-content:flex-start;gap:16px;padding:8px 18px;min-height:80px}
.tile.word .wd{font-size:34px;line-height:1.4}
.tile.word .wd.ar{font-size:36px}
.tile.ok{border-color:var(--vert);background:#DFF3EA}
.tile.no{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.opts{display:grid;gap:12px}
.gridn{display:grid;gap:8px}
.gridn .tile{min-height:66px;font-size:30px;padding:4px}
.gridn .tile.ar{font-size:34px}
.scene{background:var(--blanc);border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 10px;font:800 40px/1.2 var(--texte);color:var(--encre)}
.scene .emo{font-size:38px}
.scene .big{font-size:54px;line-height:1.4}
.scene .word{font-size:56px;letter-spacing:2px}
.coin{display:inline-grid;place-items:center;width:62px;height:62px;border-radius:50%;background:#E8BC4A;border:3px solid #8C6A12;font:800 17px/1 var(--texte);color:var(--encre)}
.coin.big{width:76px;height:76px;font-size:20px}
.group{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.group .emo{font-size:30px}
.trace{align-self:center;width:min(100%,340px);aspect-ratio:1;background:var(--blanc);border-radius:16px;touch-action:none;display:block}
.clear{align-self:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--blanc);color:var(--city);font-weight:800}
.maze{align-self:center;width:min(100%,340px);aspect-ratio:1;display:grid;background:var(--blanc);border:4px solid var(--city);touch-action:none}
.cell{display:grid;place-items:center;border:0 solid var(--city);min-width:0;min-height:0}
.cell svg{width:76%;height:76%}
.pad{align-self:center;display:grid;grid-template-columns:repeat(3,60px);gap:6px}
.pad button{width:60px;height:54px;border-radius:12px;background:var(--blanc);color:var(--city);display:grid;place-items:center}
.pad svg{width:26px;height:26px}

/* récompense, fiche ville */
.win{text-align:center;justify-content:center;gap:18px;align-items:center}
.win h2{font:800 42px/1.15 var(--titre)}
.bigstars{display:flex;gap:8px}.bigstars svg{width:56px;height:56px}
.cta{background:var(--safran);color:var(--encre);font:800 22px/1.1 var(--texte);min-height:64px;padding:0 32px;border-radius:999px}
.fact{background:var(--blanc);color:var(--encre);border-radius:18px;padding:18px;text-align:start;display:flex;flex-direction:column;gap:12px;width:100%}
.fact h3{font:800 24px/1.2 var(--titre);color:var(--city)}
.fact p{font-size:19px;line-height:1.5}
.fact p.ar{font-size:21px;line-height:1.8}
.fact .say{display:flex;gap:10px;flex-wrap:wrap}
.fact .say button{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:999px;background:var(--mur);color:var(--city);font-weight:800}
.fact .say svg{width:22px;height:22px}
.panel{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.panel button.big{min-height:60px;border-radius:14px;background:var(--blanc);color:var(--encre);font-weight:800;padding:0 16px}
.panel p{color:var(--ciel);font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--encre);color:var(--blanc);padding:12px 18px;border-radius:12px;width:max-content;max-width:calc(100% - 32px);text-align:center;font-size:16px;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

/* ---------- hasard reproductible ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function RNG(seed){const r=mulberry(seed);const o={f:r,int:(a,b)=>a+Math.floor(r()*(b-a+1)),pick:x=>x[Math.floor(r()*x.length)],
 shuffle:x=>{const y=x.slice();for(let i=y.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[y[i],y[j]]=[y[j],y[i]]}return y}};return o}

/* ---------- fabriques d'options ---------- */
const T=(t,cls)=>({html:t,cls:cls||''});
const W=(w,e,ar)=>({html:`<span class="emo">${e}</span><span class="wd ${ar?'ar':''}">${w}</span>`,cls:'word'});
const E=e=>({html:`<span class="emo">${e}</span>`});
function mc(rng,good,bad,extra){const all=[{...good,ok:1},...bad];const s=rng.shuffle(all);return Object.assign({t:'choose',opts:s,a:s.findIndex(o=>o.ok)},extra)}
function numOpts(rng,ans,min){min=min==null?0:min;const c=[];for(const d of rng.shuffle([1,-1,2,-2,3,-3])){const v=ans+d;if(v>=min&&!c.includes(v))c.push(v);if(c.length===2)break}return c}
function numQ(rng,ans,q,scene,min){return mc(rng,T(String(ans)),numOpts(rng,ans,min).map(v=>T(String(v))),{q,scene,cols:3})}
function cells(rng,target,pool,total,nt){const p=pool.filter(x=>x!==target);const out=Array(nt).fill(target);let i=0;const sp=rng.shuffle(p);while(out.length<total){out.push(sp[i%sp.length]);i++}return rng.shuffle(out)}
function similar(L,fam,all,rng){let s=[];fam.forEach(f=>{if(f.includes(L))s.push(...f.split('').filter(c=>c!==L))});s=[...new Set(s)];const rest=rng.shuffle(all.filter(c=>c!==L&&!s.includes(c)));return s.concat(rest.slice(0,Math.max(2,5-s.length)))}

function frActs(n,rng){

 ];

function maActs(n,rng){
 const c=Math.floor((n-1)/10);const em=()=>rng.pick(POOL);
 if(c===0){
  const k=rng.int(2,Math.min(10,3+n)),e1=em();
  let a=rng.int(1,9),b=rng.int(1,9);while(a===b)b=rng.int(1,9);const e2=em();

  ]}

   numQ(rng,seq[miss],'Quel nombre manque ?',seq.map((v,i)=>i===miss?'?':v).join(' &nbsp; '),1)
  ]}
 if(c===2){
  const a=rng.int(4,8),b=rng.int(1,a-1),e=em();const x=rng.int(3,10),y=rng.int(1,x);
  const ns=[];while(ns.length<3){const v=rng.int(5,20);if(!ns.includes(v))ns.push(v)}const mx=Math.max(...ns);

  ]}
 if(c===3){

  ]}

 const d=rng.int(2,10);

 ];

   <span style="font-weight:800">${k}/10</span></button>`}).join('');
 show(`<section class="screen dark">
  <div class="top"><h1>Mission Maroc</h1><div class="score" aria-label="${total()} étoiles">${ICON.star}<span>${total()}</span></div></div>
  <p class="sub">Le voyage · 50 étapes · 5-7 ans</p>
  <div class="road">${cards}</div>
  <div class="foot"><span>Prototype à tester</span><button class="link" id="parents">Espace parents</button></div></section>`);
 app.querySelectorAll('.citycard').forEach(b=>b.onclick=()=>{const ci=+b.dataset.c;if(cityOpen(ci))city(ci);else{beep(false);toast('Termine d\'abord '+CITIES[ci-1].name+'.')}});
 document.getElementById('parents').onclick=parentGate;
}

/* ---------- écran : ville ---------- */
const SPOS=[[26,5],[72,14],[28,24],[72,34],[28,44],[72,54],[28,64],[72,74],[28,84],[70,94]];
function city(ci){
 cur={s:'city',ci};tint(ci);const c=CITIES[ci];const nx=nextStage();
 const stones=SPOS.map((p,i)=>{const n=ci*10+i+1,open=stageOpen(n),done=stageDone(n),now=open&&!done&&(n===nx||S.all);
  const dots=DOORS.map(d=>`<i class="${doorStars(n,d.id)?'on':''}"></i>`).join('');
  return `<button class="stone ${done?'done':''} ${now?'now':''} ${open?'':'lock'}" data-n="${n}" style="left:${p[0]}%;top:${p[1]}%" aria-label="Étape ${n}${open?'':', fermée'}"><span class="disc">${n}</span><span class="dots">${dots}</span></button>`}).join('');
 show(`<section class="screen dark">
  <div class="top"><button class="round" id="out" aria-label="Retour au voyage">${ICON.back}</button><div class="mid"><h1>${c.name}</h1><p>Ville ${ci+1} sur 5 · ${cityCount(ci)}/10 étapes</p></div><div class="score">${ICON.star}<span>${total()}</span></div></div>
  <div class="street"><svg class="way" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="${SPOS.map(p=>p.join(' ')).join(',')}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3" stroke-dasharray="1 8" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>${stones}</div>
 </section>`);
 document.getElementById('out').onclick=journey;
 app.querySelectorAll('.stone').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;if(stageOpen(n))stage(n);else{beep(false);toast('Termine d\'abord l\'étape '+(n-1)+'.')}});
 if(cur.scrollTo){}
}

/* ---------- écran : étape ---------- */
function stage(n){
 cur={s:'stage',n};const ci=cityOf(n);tint(ci);
 const doors=DOORS.map(d=>{const st=doorStars(n,d.id);const m=mark(n,d.id);
  return `<button class="door ${st?'done':''}" data-d="${d.id}" aria-label="${d.name}${st?', terminé':''}"><span class="arch ${d.id==='ar'?'ar':''}" ${d.id==='ar'?'dir="rtl"':''}>${m}</span><span>${d.name}</span><span class="stars">${st?starsHtml(st):''}</span></button>`}).join('');
 show(`<section class="screen dark">
  <div class="top"><button class="round" id="out" aria-label="Retour à ${CITIES[ci].name}">${ICON.back}</button><div class="mid"><h1>Étape ${n}</h1><p>${CITIES[ci].name} · choisis une porte</p></div></div>
  <div class="doors">${doors}</div></section>`);
 document.getElementById('out').onclick=()=>city(ci);
 app.querySelectorAll('.door').forEach(b=>b.onclick=()=>play(n,b.dataset.d));
}

/* ---------- jeu ---------- */
let cleanup=()=>{};
function play(n,id){
 const door=DOORS.find(d=>d.id===id),acts=stageActs(n,id);let idx=0,errs=0,busy=false;
 cur={s:'play',n};const words=WORDS[door.lang];const rtl=door.lang==='ar';
 function draw(){
  const a=acts[idx];window.__cur=a;
  const dots=acts.map((_,i)=>`<i class="${i<=idx?'on':''}"></i>`).join('');
  show(`<section class="screen lesson" ${rtl?'dir="rtl"':''}>
   <div class="bar"><button class="round" id="out" aria-label="Retour aux portes">${ICON.close}</button><div class="steps">${dots}</div><button class="round" id="say" aria-label="Écouter la consigne">${ICON.sound}</button></div>
   <h2 class="q ${rtl?'ar':''}">${a.q}</h2><div class="play" id="play"></div><p class="msg" id="msg" role="status"></p></section>`,true);
  document.getElementById('out').onclick=()=>stage(n);
  document.getElementById('say').onclick=()=>speak(a.q,door.lang);
  ({trace,find,choose,maze})[a.t](document.getElementById('play'),a,{ok,no},rtl);
 }
 function msg(t,c){const m=document.getElementById('msg');if(m){m.textContent=t;m.className='msg '+c}}
 function ok(){if(busy)return;busy=true;beep(true);msg(words[0],'ok');setTimeout(()=>{busy=false;if(cur.s!=='play')return;idx++;idx<acts.length?draw():end()},700)}
 function no(el){errs++;beep(false);msg(words[1],'no');if(el){el.classList.remove('no');void el.offsetWidth;el.classList.add('no')}}
 function end(){
  const was=stageDone(n);const st=errs===0?3:errs<=2?2:1;const k=n+'-'+id;S.done[k]=Math.max(S.done[k]||0,st);save();
  const finished=!was&&stageDone(n);
  cur={s:'win',n};
  show(`<section class="screen dark win"><h2>${finished?'Étape '+n+' terminée !':'Bravo !'}</h2>
   <div class="bigstars" aria-label="${st} étoiles sur 3">${starsHtml(st)}</div>
   <p style="font-size:20px;font-weight:800">${finished?'Les 5 portes sont ouvertes.':'Porte '+door.name+' réussie.'}</p>
   <button class="cta" id="go">${finished?(n%10===0?'Découvrir la ville':'Étape suivante'):'Retour aux portes'}</button></section>`);
  document.getElementById('go').onclick=()=>{if(!finished)stage(n);else if(n%10===0)fact(cityOf(n));else stage(n+1)};
 }
 draw();
}

function choose(host,a,api,rtl){
 const cols=a.cols||3;
 host.innerHTML=`${a.scene?`<div class="scene" dir="${rtl?'rtl':'ltr'}">${a.scene}</div>`:''}<div class="opts" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${a.opts.map((o,i)=>`<button class="tile ${o.cls||''}" data-i="${i}">${o.html}</button>`).join('')}</div>`;
 let fin=false;
 host.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(fin)return;if(+b.dataset.i===a.a){fin=true;b.classList.add('ok');api.ok()}else api.no(b)});
}
function find(host,a,api){
 const need=a.cells.filter(c=>c===a.target).length;let got=0;
 host.innerHTML=`<div class="gridn" style="grid-template-columns:repeat(${a.cols},minmax(0,1fr))">${a.cells.map(c=>`<button class="tile ${a.ar?'ar':''}" data-c="${c}">${c}</button>`).join('')}</div>`;
 host.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(b.classList.contains('ok'))return;
  if(b.dataset.c===a.target){b.classList.add('ok');if(++got===need)api.ok();else beep(true)}else api.no(b)});
}
function trace(host,a,api,rtl){
 host.innerHTML=`<canvas class="trace" width="340" height="340" aria-label="Zone de traçage"></canvas><button class="clear" id="clr">${rtl?'اِمْسَحْ':a.q.startsWith('Trace the')?'Clear':'Effacer'}</button>`;
 const c=host.querySelector('canvas'),g=c.getContext('2d',{willReadFrequently:true}),size=340;
 const fam=a.ar?"'Noto Naskh Arabic',serif":"Nunito,sans-serif",wt=a.ar?700:800;
 let font='',gx=170,gy=170;
 function fit(){let px=a.ar?250:290;for(;px>60;px-=10){g.font=`${wt} ${px}px ${fam}`;const m=g.measureText(a.glyph);const h=(m.actualBoundingBoxAscent||px*.7)+(m.actualBoundingBoxDescent||0);if(m.width<=290&&h<=290)break}
  font=`${wt} ${px}px ${fam}`;g.font=font;g.textAlign='center';g.textBaseline='alphabetic';const m=g.measureText(a.glyph);
  const asc=m.actualBoundingBoxAscent||px*.7,desc=m.actualBoundingBoxDescent||0;gy=170+(asc-desc)/2;
  const l=m.actualBoundingBoxLeft,r=m.actualBoundingBoxRight;gx=(l!=null&&r!=null)?170+(l-r)/2:170}
 let strokes=[],mask=null,fin=false,total=0;
 function guide(){g.clearRect(0,0,size,size);g.fillStyle='#BCD3F5';g.font=font;g.textAlign='center';g.textBaseline='alphabetic';g.fillText(a.glyph,gx,gy)}
 function ink(x){x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--city').trim()||'#1E4FA8';x.lineWidth=26;x.lineCap='round';x.lineJoin='round';strokes.forEach(s=>{x.beginPath();x.moveTo(s[0][0],s[0][1]);s.forEach(p=>x.lineTo(p[0],p[1]));if(s.length===1)x.lineTo(s[0][0]+.1,s[0][1]);x.stroke()})}
 function paint(){guide();ink(g)}
 function build(){fit();guide();const d=g.getImageData(0,0,size,size).data;mask=new Uint8Array(size*size);total=0;for(let i=0;i<mask.length;i++){if(d[i*4+3]>120){mask[i]=1;total++}}paint()}
 function near(x,y){for(let dy=-14;dy<=14;dy+=7)for(let dx=-14;dx<=14;dx+=7){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<size&&Y<size&&mask[Y*size+X])return true}return false}
 function grade(){if(fin||!total)return;const o=document.createElement('canvas');o.width=o.height=size;const x=o.getContext('2d');ink(x);const d=x.getImageData(0,0,size,size).data;
  let hit=0,inked=0,off=0;for(let y=0;y<size;y++)for(let i=0;i<size;i++){const k=y*size+i;if(d[k*4+3]>120){inked++;if(!near(i,y))off++;if(mask[k])hit++}}
  if(inked&&hit/total>=.68&&off/inked<=.3){fin=true;api.ok()}}
 const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*size/r.width,(e.clientY-r.top)*size/r.height]};
 let down=false;
 c.onpointerdown=e=>{if(fin)return;down=true;try{c.setPointerCapture(e.pointerId)}catch(_){}strokes.push([pos(e)]);paint()};
 c.onpointermove=e=>{if(!down)return;strokes[strokes.length-1].push(pos(e));paint()};
 c.onpointerup=c.onpointercancel=()=>{if(!down)return;down=false;grade()};
 host.querySelector('#clr').onclick=()=>{strokes=[];paint()};
 fit();guide();
 const ready=document.fonts&&document.fonts.load?document.fonts.load(`${wt} 100px ${fam}`,a.glyph).catch(()=>{}):Promise.resolve();
 Promise.resolve(ready).then(build);
}
function buildMaze(n,seed){
 const r=mulberry(seed);const open=Array.from({length:n*n},()=>({N:0,E:0,S:0,W:0}));
 const seen=new Set([0]),stack=[0],D={N:[0,-1,'S'],E:[1,0,'W'],S:[0,1,'N'],W:[-1,0,'E']};
 while(stack.length){const c=stack[stack.length-1],x=c%n,y=(c/n)|0;
  const opts=Object.keys(D).filter(d=>{const X=x+D[d][0],Y=y+D[d][1];return X>=0&&Y>=0&&X<n&&Y<n&&!seen.has(Y*n+X)});
  if(!opts.length){stack.pop();continue}
  const d=opts[Math.floor(r()*opts.length)],X=x+D[d][0],Y=y+D[d][1],k=Y*n+X;open[c][d]=1;open[k][D[d][2]]=1;seen.add(k);stack.push(k)}
 return open}
function maze(host,a,api){
 const n=a.n,open=buildMaze(n,a.seed);let at=0,fin=false;const b=n>6?3:4;
 host.innerHTML=`<div class="maze" id="mz" style="grid-template-columns:repeat(${n},1fr)" dir="ltr">${open.map((c,i)=>`<div class="cell" style="border-top-width:${c.N?0:b}px;border-right-width:${c.E?0:b}px;border-bottom-width:${c.S?0:b}px;border-left-width:${c.W?0:b}px"></div>`).join('')}</div>
 <div class="pad" dir="ltr"><span></span><button data-d="N" aria-label="Haut">${ICON.arrow}</button><span></span><button data-d="W" aria-label="Gauche" style="transform:rotate(-90deg)">${ICON.arrow}</button><button data-d="S" aria-label="Bas" style="transform:rotate(180deg)">${ICON.arrow}</button><button data-d="E" aria-label="Droite" style="transform:rotate(90deg)">${ICON.arrow}</button></div>`;
 const cells=[...host.querySelectorAll('.cell')];
 const paint=()=>cells.forEach((c,i)=>c.innerHTML=i===at?ICON.cat:i===n*n-1?ICON.door:'');
 const moveTo=t=>{at=t;paint();if(at===n*n-1&&!fin){fin=true;api.ok()}};
 const step=d=>{if(fin)return;const m={N:-n,E:1,S:n,W:-1};if(open[at][d])moveTo(at+m[d]);else beep(false)};
 paint();
 host.querySelectorAll('.pad button').forEach(p=>p.onclick=()=>step(p.dataset.d));
 const mz=host.querySelector('#mz');let down=false;
 const drag=e=>{if(fin)return;const r=mz.getBoundingClientRect(),X=Math.floor((e.clientX-r.left)/r.width*n),Y=Math.floor((e.clientY-r.top)/r.height*n);if(X<0||Y<0||X>=n||Y>=n)return;
  const ax=at%n,ay=(at/n)|0,t=Y*n+X;const d=X===ax+1&&Y===ay?'E':X===ax-1&&Y===ay?'W':Y===ay+1&&X===ax?'S':Y===ay-1&&X===ax?'N':null;if(d&&open[at][d])moveTo(t)};
 mz.onpointerdown=e=>{down=true;try{mz.setPointerCapture(e.pointerId)}catch(_){}drag(e)};
 mz.onpointermove=e=>{if(down)drag(e)};
 mz.onpointerup=mz.onpointercancel=()=>down=false;
}

/* ---------- fiche ville ---------- */
function fact(ci){
 cur={s:'fact',ci};tint(ci);const c=CITIES[ci];const last=ci===4;
 show(`<section class="screen dark win">
  <div class="bigstars">${ICON.star+ICON.star+ICON.star}</div>
  <h2>${last?'Voyage terminé !':'Tu as fini '+c.name+' !'}</h2>
  <div class="fact"><h3>Le savais-tu ?</h3><p>${c.fr}</p><p class="ar" dir="rtl">${c.far}</p>
   <div class="say"><button id="sfr">${ICON.sound}Écouter</button><button id="sar">${ICON.sound}<span class="ar">اِسْتَمِعْ</span></button></div></div>
  <button class="cta" id="go">${last?'Retour au voyage':'En route pour '+CITIES[ci+1].name}</button></section>`);
 document.getElementById('sfr').onclick=()=>speak(c.fr,'fr');
 document.getElementById('sar').onclick=()=>speak(c.far,'ar');
 document.getElementById('go').onclick=()=>last?journey():city(ci+1);
}

/* ---------- espace parents ---------- */
function parentGate(){
 cur={s:'parent'};const a=6+Math.floor(Math.random()*4),b=6+Math.floor(Math.random()*3),r=a*b;
 const opts=[r,r+a,r-b].sort(()=>Math.random()-.5);
 show(`<section class="screen dark"><div class="top"><button class="round" id="out" aria-label="Retour au voyage">${ICON.back}</button><div class="mid"><h1>Espace parents</h1><p>Réservé aux adultes</p></div></div>
  <p style="margin-top:24px;font-size:22px;font-weight:800;text-align:center">Combien font ${a} × ${b} ?</p>
  <div class="opts" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px">${opts.map(v=>`<button class="tile" data-v="${v}">${v}</button>`).join('')}</div></section>`);
 document.getElementById('out').onclick=journey;
 app.querySelectorAll('[data-v]').forEach(t=>t.onclick=()=>{if(+t.dataset.v===r)parents();else journey()});
}
function parents(){
 cur={s:'parent'};
 show(`<section class="screen dark"><div class="top"><button class="round" id="out" aria-label="Retour au voyage">${ICON.back}</button><div class="mid"><h1>Espace parents</h1><p>${total()} étoiles · étape ${Math.min(nextStage(),50)} sur 50</p></div></div>
  <div class="panel">
   <button class="big" id="all">${S.all?'Reverrouiller les étapes':'Ouvrir toutes les étapes'}</button>
   <p>Pour essayer n'importe quelle étape sans suivre l'ordre.</p>
   <button class="big" id="reset">Tout effacer</button>
   <p>Efface les étoiles et la progression de cet appareil.</p>
  </div></section>`);
 document.getElementById('out').onclick=journey;
 document.getElementById('all').onclick=()=>{S.all=!S.all;save();parents()};
 const r=document.getElementById('reset');r.onclick=()=>{if(r.dataset.c){S={done:{},all:false};save();journey()}else{r.dataset.c=1;r.textContent='Confirmer : tout effacer ?'}};
}

window.appBack=()=>{const s=cur.s;
 if(s==='journey')return false;
 if(s==='play'||s==='win')stage(cur.n);else if(s==='stage')city(cityOf(cur.n));else if(s==='fact')city(cur.ci);else journey();return true};
window.__stageActs=stageActs;
journey();
</script>
